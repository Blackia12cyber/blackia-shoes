<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKIA - پاس ورڈ بھول جانا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .box {
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #d4af37;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .tagline {
            color: #bbb;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #d4af37;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #ffaa00;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37 0%, #ffaa00 100%);
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #d4af37;
            text-decoration: none;
            font-size: 13px;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .success {
            background: rgba(40, 167, 69, 0.15);
            color: #51cf66;
        }

        .error {
            background: rgba(220, 53, 69, 0.15);
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="logo">
                <h1>BLACKIA</h1>
                <p class="tagline">Step Into Style</p>
            </div>

            <p style="color: #aaa; font-size: 13px; margin-bottom: 20px;">
                اپنا ای میل ڈالیں تاکہ ہم آپ کو پاس ورڈ reset کرنے کے لیے لنک بھیج سکیں۔
            </p>

            <div id="message" class="message"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label>ای میل</label>
                    <input type="email" id="email" placeholder="آپ کا رجسٹرڈ ای میل" required>
                </div>

                <button type="submit" class="submit-btn">Reset Link بھیجیں</button>
            </form>

            <div class="back-link">
                <a href="login.html">← واپس لاگ ان میں جائیں</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB4NUuBGGDDignA55z_IfNU78e7l2-T3vE",
            authDomain: "blckiashoes.firebaseapp.com",
            projectId: "blckiashoes",
            storageBucket: "blckiashoes.firebasestorage.app",
            messagingSenderId: "264597463698",
            appId: "1:264597463698:web:aa7eee5cca0f1bbd547c4b"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');

            try {
                await auth.sendPasswordResetEmail(email);
                messageDiv.textContent = '✅ آپ کے ای میل میں reset link بھیج دیا گیا!';
                messageDiv.className = 'message success';
                messageDiv.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';

                if (error.code === 'auth/user-not-found') {
                    messageDiv.textContent = '❌ یہ ای میل رجسٹرڈ نہیں ہے';
                } else if (error.code === 'auth/invalid-email') {
                    messageDiv.textContent = '❌ غلط ای میل فارمیٹ';
                } else {
                    messageDiv.textContent = '❌ خرابی واقع ہوئی';
                }
            }
        });
    </script>
</body>
</html>
