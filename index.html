<!DOCTYPE html>
<html>
<head>
  <title>BLACKIA SHOES</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f0f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #fff; }
    header { background: #000; border-bottom: 1px solid #333; padding: 1rem; position: sticky; top: 0; z-index: 100; }
    .container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-box { width: 40px; height: 40px; background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; font-size: 20px; }
    h1 { font-size: 20px; font-weight: 600; }
    .tagline { color: #d4af37; font-size: 14px; font-weight: 500; }
    .cart-btn { background: #d4af37; color: #000; padding: 8px 16px; border-radius: 20px; font-weight: 600; border: none; cursor: pointer; }
    .hero { background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); padding: 3rem 1rem; text-align: center; border-bottom: 1px solid #333; }
    .hero h2 { color: #d4af37; font-size: 32px; margin-bottom: 10px; }
    .hero p { color: #999; font-size: 16px; }
    .section { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
    .section h2 { color: #fff; font-size: 24px; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
    .product-card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; overflow: hidden; }
    .product-image { background: #2d2d2d; padding: 2rem; text-align: center; font-size: 60px; }
    .product-info { padding: 1.5rem; }
    .product-name { color: #fff; margin-bottom: 0.5rem; font-size: 16px; font-weight: 600; }
    .price-row { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem; }
    .price { color: #d4af37; font-size: 18px; font-weight: 700; }
    .original { color: #999; text-decoration: line-through; font-size: 14px; }
    .discount-badge { background: #d4af37; color: #000; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .add-btn { width: 100%; padding: 10px; background: #d4af37; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; overflow-y: auto; }
    .modal-content { background: #1a1a1a; max-width: 500px; margin: 2rem auto; border: 1px solid #333; border-radius: 12px; }
    .modal-header { padding: 1.5rem; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; font-size: 20px; }
    .close-btn { background: none; border: none; color: #999; font-size: 24px; cursor: pointer; }
    .modal-items { padding: 1.5rem; min-height: 100px; max-height: 400px; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid #333; }
    .cart-item-info p { margin: 0; }
    .cart-item-name { color: #fff; font-weight: 500; }
    .cart-item-price { color: #999; font-size: 14px; }
    .remove-btn { background: none; border: none; color: #d4af37; cursor: pointer; font-weight: 600; }
    .modal-footer { padding: 1.5rem; border-top: 1px solid #333; background: #0f0f0f; }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 18px; }
    .total-value { color: #d4af37; font-weight: 600; }
    .checkout-btn { width: 100%; padding: 12px; background: #d4af37; color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="logo">
        <div class="logo-box">B</div>
        <h1>BLACKIA SHOES</h1>
      </div>
      <div class="tagline">STEP INTO STYLE</div>
      <button class="cart-btn" id="cartBtn">Cart: 0</button>
    </div>
  </header>

  <section class="hero">
    <h2>Premium Footwear</h2>
    <p>Discover our exclusive collection of premium shoes</p>
  </section>

  <div class="section">
    <h2>Featured Collection</h2>
    <div class="grid" id="productsGrid"></div>
  </div>

  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Shopping Cart</h3>
        <button class="close-btn" onclick="closeCart()">×</button>
      </div>
      <div class="modal-items" id="cartItems">
        <p style="color: #999; text-align: center;">Your cart is empty</p>
      </div>
      <div class="modal-footer">
        <div class="total-row">
          <span>Total:</span>
          <span class="total-value" id="cartTotal">₹0</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
      </div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: 'Classic White Sneaker', price: 4499, original: 4999, discount: 10, image: '👟' },
      { id: 2, name: 'Black Formal Oxford', price: 6999, original: 6999, discount: 0, image: '👞' },
      { id: 3, name: 'Running Pro Max', price: 6799, original: 7999, discount: 15, image: '🏃' },
      { id: 4, name: 'Desert Boot Brown', price: 5699, original: 5999, discount: 5, image: '🥾' },
      { id: 5, name: 'Basketball Elite', price: 7199, original: 8999, discount: 20, image: '🏀' },
      { id: 6, name: 'Summer Sandal', price: 2249, original: 2999, discount: 25, image: '👒' }
    ];

    let cart = [];

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-image">${p.image}</div>
          <div class="product-info">
            <p class="product-name">${p.name}</p>
            <div class="price-row">
              <span class="price">₹${p.price}</span>
              ${p.discount > 0 ? `<span class="original">₹${p.original}</span><span class="discount-badge">${p.discount}% OFF</span>` : ''}
            </div>
            <button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existing = cart.find(c => c.id === productId);
      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      updateCart();
    }

    function removeFromCart(productId) {
      cart = cart.filter(c => c.id !== productId);
      updateCart();
    }

    function updateCart() {
      document.getElementById('cartBtn').textContent = `Cart: ${cart.length}`;
      const cartItems = document.getElementById('cartItems');
      if (cart.length === 0) {
        cartItems.innerHTML = '<p style="color: #999; text-align: center;">Your cart is empty</p>';
      } else {
        cartItems.innerHTML = cart.map(item => `
          <div class="cart-item">
            <div>
              <p class="cart-item-name">${item.name}</p>
              <p class="cart-item-price">₹${item.price} × ${item.quantity}</p>
            </div>
            <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
          </div>
        `).join('');
      }
      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      document.getElementById('cartTotal').textContent = `₹${total.toLocaleString()}`;
    }

    function closeCart() {
      document.getElementById('cartModal').style.display = 'none';
    }

    function checkout() {
      if (cart.length === 0) {
        alert('Add products to cart first!');
        return;
      }
      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      alert(`Order placed!\nTotal: ₹${total.toLocaleString()}\n\nThank you for shopping!`);
      cart = [];
      updateCart();
      closeCart();
    }

    document.getElementById('cartBtn').onclick = () => {
      document.getElementById('cartModal').style.display = 'block';
    };

    renderProducts();
  </script>
</body>
</html>
