<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKIA - Customer Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-box {
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.2);
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #d4af37;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .tagline {
            color: #bbb;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #d4af37;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #ffaa00;
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remember-me label {
            margin: 0;
            cursor: pointer;
            color: #aaa;
        }

        .forgot-link {
            color: #d4af37;
            text-decoration: none;
        }

        .forgot-link:hover {
            color: #ffaa00;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37 0%, #ffaa00 100%);
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 12px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
        }

        .guest-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #d4af37;
            border: 2px solid #d4af37;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .guest-btn:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        .signup-link {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-top: 20px;
        }

        .signup-link a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.15);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .contact-info {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }

        .contact-info a {
            color: #d4af37;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <h1>BLACKIA</h1>
                <p class="tagline">Step Into Style</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="آپ کا ای میل" 
                        required 
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="پاس ورڈ" 
                        required 
                    >
                </div>

                <div class="remember-forgot">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">مجھے یاد رکھیں</label>
                    </div>
                    <a href="forgot-password.html" class="forgot-link">پاس ورڈ بھولے؟</a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">LOGIN</button>
                <button type="button" class="guest-btn" onclick="alert('Store page coming soon!')">مہمان طور پر براؤز کریں</button>
            </form>

            <div class="signup-link">
                اکاؤنٹ نہیں ہے؟ <a href="signup.html">ابھی ساتھ شامل ہوں</a>
            </div>

            <div class="contact-info">
                <p>📧 <a href="mailto:blackiaop257@gmail.com">blackiaop257@gmail.com</a></p>
                <p>📱 <a href="https://wa.me/923326630676">WhatsApp: +92 332 663 0676</a></p>
            </div>
        </div>
    </div>
